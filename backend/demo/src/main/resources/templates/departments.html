
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Departments</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
        }

        .add {
            background: #198754;
            color: white;
            padding: 10px 16px;
            border-radius: 5px;
            text-decoration: none;
        }

        .add:hover {
            background: #157347;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f3f5;
        }

        .edit {
            color: #0d6efd;
            text-decoration: none;
            margin-right: 10px;
        }

        .delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 7px 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete:hover {
            background: #bb2d3b;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        .employees {
            display: inline-block;
            margin-top: 20px;
            color: #0d6efd;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Department Management</h1>

        <a class="add"
           th:href="@{/departments/new}">
            + Add Department
        </a>

    </div>


    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Department Name</th>

            <th>Actions</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="department : ${departments}">

            <td th:text="${department.id}">
                1
            </td>

            <td th:text="${department.name}">
                IT
            </td>

            <td>

                <a class="edit"
                   th:href="@{/departments/edit/{id}(id=${department.id})}">
                    Edit
                </a>


                <form th:action="@{/departments/delete/{id}(id=${department.id})}"
                      method="post"
                      style="display:inline;">

                    <button class="delete"
                            type="submit"
                            onclick="return confirm('Are you sure you want to delete this department?');">
                        Delete
                    </button>

                </form>

            </td>

        </tr>


        <tr th:if="${#lists.isEmpty(departments)}">

            <td colspan="3"
                class="empty">

                No departments found.

            </td>

        </tr>

        </tbody>

    </table>


    <a class="employees"
       th:href="@{/employees}">
        ← Back to Employees
    </a>

</div>

</body>

</html>
