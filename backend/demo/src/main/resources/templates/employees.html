
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f6f9;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: #243447;
        }

        .add-button {
            display: inline-block;
            background: #198754;
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #243447;
            color: white;
        }

        tr:nth-child(even) {
            background: #f7f8fa;
        }

        .edit {
            color: #0d6efd;
        }

        .delete {
            color: #dc3545;
            border: none;
            background: none;
            cursor: pointer;
            font: inherit;
            padding: 0;
        }

        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .empty {
            text-align: center;
            color: #666;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Employee Management System</h1>

    <a class="add-button" th:href="@{/employees/new}">
        + Add Employee
    </a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Position</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.id}"></td>
            <td th:text="${employee.fullName}"></td>
            <td th:text="${employee.email}"></td>
            <td th:text="${employee.department != null ? employee.department.name : 'No Department'}"></td>
            <td th:text="${employee.position}"></td>

            <td>
                <div class="actions">
                    <a class="edit"
                       th:href="@{/employees/edit/{id}(id=${employee.id})}">
                        Edit
                    </a>

                    <form th:action="@{/employees/delete/{id}(id=${employee.id})}"
                          method="post"
                          onsubmit="return confirm('Delete this employee?');">

                        <button class="delete" type="submit">
                            Delete
                        </button>
                    </form>
                </div>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="6" class="empty">
                No employees found. Click Add Employee to create one.
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
